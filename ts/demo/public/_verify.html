<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;font-family:system-ui;background:#eee;padding:20px}
  .row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px}
  .light{background:#fff}.dark{background:#0D1829;color:#fff}
  .splash{width:520px;height:293px;background:#0D1829;display:flex;align-items:center;justify-content:center;border-radius:12px}
  video{width:82%}
  span{font-size:13px;color:#555}
</style></head><body>
  <div class="row">
    <span>Sidebar-size symbol (size-8 = 32px):</span>
    <div class="chip light"><img src="/beculture-logo.svg" width="32" height="32"><b style="font-size:13px;color:#1e293b">BeHuman</b></div>
    <div class="chip dark"><img src="/beculture-logo.svg" width="32" height="32" style="display:none"><img src="/beculture-logo.svg" width="32" height="32"><b style="font-size:13px">BeHuman (dark: person should be white)</b></div>
  </div>
  <div class="row">
    <span>Splash animation (beculture-loader.mp4):</span>
    <div class="splash"><video src="/videos/beculture-loader.mp4" autoplay muted playsinline loop></video></div>
  </div>
</body></html>
