services:
  db:
    image: postgres:16-alpine
    container_name: beculture-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beculture
      POSTGRES_PASSWORD: beculture
      POSTGRES_DB: beculture
    ports:
      # Só na interface local: evita expor o Postgres (senha de dev) na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - beculture-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beculture -d beculture"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beculture-pgdata:
